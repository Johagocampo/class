<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form action="login.php" method="post">
            <input type="email" name="email" id="email" placeholder="Correo electrónico" required><br>
            <input type="password" name="password" id="password" placeholder="Contraseña" required><br>
            <button type="submit">Ingresar</button>
            
        </form>
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
    
    
</body>

<script>
    document.addEventListener("DOMContentLoaded", function() {
       
        const urlParams = new URLSearchParams(window.location.search);


        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        if (urlParams.has('error')) {
            if (emailInput) emailInput.style.border = "2px solid red";
            if (passwordInput) passwordInput.style.border = "2px solid red";
        }


        if (emailInput) {
            emailInput.addEventListener("focus", function() {
                this.style.border = "1px solid #ccc"; 
            });
        }

        if (passwordInput) {
            passwordInput.addEventListener("focus", function() {
                console.log("Input de contraseña enfocado"); // Depuración
                this.style.border = "1px solid #ccc";
            });
        }
    });
</script>



</html>
